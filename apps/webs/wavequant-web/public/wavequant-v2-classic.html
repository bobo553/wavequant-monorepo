function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function makeData(s,idx){let r=rng(917+idx*4531),data=[],prev=s.base*1.27;const anchors=[[0,1.15],[18,1.02],[44,1.33],[66,1.62],[83,1.14],[106,1.29],[132,.86],[154,.99],[166,.95],[179,1]];
 for(let i=0;i<=LAST;i++){let a=anchors.findIndex((x,j)=>j<anchors.length-1&&i>=x[0]&&i<=anchors[j+1][0]);if(a<0)a=anchors.length-2;const [x,y]=anchors[a],[xx,yy]=anchors[a+1];let shape=y+(yy-y)*(i-x)/(xx-x);if(idx>0)shape=1+(shape-1)*.43+.1*Math.sin(i*.07+idx);
 let close=s.base*(shape+(r()-.5)*.045),open=prev*(1+(r()-.5)*.013);close=Math.max(open*.93,Math.min(open*1.07,close));let high=Math.max(open,close)*(1+r()*.018),low=Math.min(open,close)*(1-r()*.017);data.push({date:dates[i],o:round(open),h:round(high),l:round(low),c:round(close),v:Math.floor((18000000+r()*58000000)*(1+Math.abs(close/open-1)*15)),idx:i});prev=close;}
 const factor=s.base/data[LAST].c;data=data.map(d=>({...d,o:round(d.o*factor),h:round(d.h*factor),l:round(d.l*factor),c:round(d.c*factor)}));data[LAST].c=s.base;
 const changes=[.04,-.38,12.3,.04,-.28,.12,-.18,.24,.32,-.07,.03,-.03];data[LAST-1].c=round(s.base-changes[idx]);data[LAST-1].h=Math.max(data[LAST-1].h,data[LAST-1].c);data[LAST-1].l=Math.min(data[LAST-1].l,data[LAST-1].c);data[LAST].o=round(data[LAST-1].c*(1+(idx%2?.001:-.002)));data[LAST].h=round(Math.max(data[LAST].o,s.base)*1.012);data[LAST].l=round(Math.min(data[LAST].o,s.base)*.993);return data;}

function toast(message,action,label='撤销',duration=5200){
 const host=$('#toasts');for(const existing of $$('.toast',host)){if(existing.dataset.message===message){clearTimeout(existing._timer);existing.remove();}}
 const el=document.createElement('div');el.className='toast';el.id='toast-'+ ++toastCounter;el.dataset.message=message;el.innerHTML=`${icon('check')}<span>${esc(message)}</span>`;
 if(action){el.dataset.undo='true';const b=document.createElement('button');b.textContent=label;b.onclick=()=>{action();el.remove();};el.append(b);}host.append(el);
 while(host.children.length>3){const discard=$$('.toast:not([data-undo])',host).find(x=>x!==el)||host.firstElementChild;clearTimeout(discard._timer);discard.remove();}
 el._timer=setTimeout(()=>el.remove(),duration);
}

// Event-driven, long-only moving-average backtest on synthetic daily OHLC.
function runEngine(p,limit){const a=DATA[p.stock].slice(0,limit+1),first=a.findIndex(d=>d.date>=p.start),last=a.findLastIndex(d=>d.date<=p.end);let cash=p.capital,qty=0,entry=0,peak=p.capital,maxdd=0,pending=null,entryIndex=-1,wins=0,closed=0;const curve=[],trades=[],costRate=p.cost/100,slip=p.slip/10000;
 for(let i=first;i<=last;i++){const d=a[i];if(pending){if(pending.side==='buy'&&qty===0){const price=round(d.o*(1+slip)),budget=cash*p.alloc/100,n=Math.floor(budget/(price*(1+costRate))/100)*100;if(n>0){const fee=round(n*price*costRate);cash=round(cash-n*price-fee);qty=n;entry=price+fee/n;entryIndex=i;trades.push({date:d.date,signalDate:a[pending.signal].date,signalIndex:pending.signal,index:i,side:'买入',price,qty:n,fee,reason:pending.reason});}}else if(pending.side==='sell'&&qty>0&&entryIndex<i){const price=round(d.o*(1-slip)),fee=round(qty*price*costRate),pnl=qty*(price-entry)-fee;cash=round(cash+qty*price-fee);trades.push({date:d.date,signalDate:a[pending.signal].date,signalIndex:pending.signal,index:i,side:'卖出',price,qty,fee,reason:pending.reason,pnl});closed++;if(pnl>0)wins++;qty=0;entry=0;}pending=null;}
 const equity=cash+qty*d.c;peak=Math.max(peak,equity);maxdd=Math.max(maxdd,1-equity/peak);curve.push({date:d.date,equity,benchmark:p.capital*d.c/a[first].o});if(i>=p.slow&&i<last){const fast=sma(a,i,p.fast),slow=sma(a,i,p.slow),prevFast=sma(a,i-1,p.fast),prevSlow=sma(a,i-1,p.slow);if(qty===0&&fast>slow&&prevFast<=prevSlow)pending={side:'buy',signal:i,reason:'快均线上穿慢均线'};if(qty>0&&(fast<slow&&prevFast>=prevSlow||d.c<entry*(1-p.stop/100)))pending={side:'sell',signal:i,reason:d.c<entry*(1-p.stop/100)?'收盘触及止损阈值':'快均线下穿慢均线'};}}
 const equity=curve.at(-1).equity;return{params:{...p},curve,trades,return:(equity/p.capital-1)*100,maxdd:maxdd*100,winrate:closed?wins/closed*100:null,closed,wins,qty,cash,final:equity,cost:trades.reduce((x,t)=>x+t.fee,0),created:new Date().toISOString(),limit};}

function openDatePicker(targetId){
 const target=$('#'+targetId);if(!target||target.disabled)return;
 const lower=dates[0],upper=dates[cut()],original=validISODate(target.value)?target.value:upper;
 let month=(original<lower?lower:original>upper?upper:original).slice(0,7)+'-01';
 function monthShift(n){const d=new Date(month+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);return d.toISOString().slice(0,10);}
 function setDate(value){target.value=value;target.dispatchEvent(new Event('input',{bubbles:true}));closeDialog();target.focus();}
 function draw(){
  const d=new Date(month+'T00:00:00Z'),year=d.getUTCFullYear(),m=d.getUTCMonth(),offset=(d.getUTCDay()+6)%7,len=new Date(Date.UTC(year,m+1,0)).getUTCDate();

  $('#calendarcontent').innerHTML=`<div class="between"><button class="iconbtn quiet" id="calprev" aria-label="上个月" ${prevDisabled?'disabled':''}>${icon('prev')}</button><h3>${year} 年 ${m+1} 月</h3><button class="iconbtn quiet" id="calnext" aria-label="下个月" ${nextDisabled?'disabled':''}>${icon('next')}</button></div><div class="calendargrid"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>${cells}</div><p class="tiny muted" style="line-height:1.9">可选范围：${lower} — ${upper}<br>箭头键移动日期；Enter 确认。周末可作为区间边界，但无合成行情条目。</p>`;
  $('#calprev').onclick=()=>{month=monthShift(-1);draw();$('#calprev').disabled?$('#calnext').focus():$('#calprev').focus();};
  $('#calnext').onclick=()=>{month=monthShift(1);draw();$('#calnext').disabled?$('#calprev').focus():$('#calnext').focus();};

 }
 openDialog(targetId==='btstart'?'选择起始样本日期':'选择结束样本日期','<div id="calendarcontent"></div>',`<button data-action="close-dialog">取消</button><button id="callast">使用可见末日</button>`);

in="2" max="89" value="${p.fast}"></div><div class="field"><label for="btslow">慢线周期（日）</label><input id="btslow" name="slow" type="number" min="3" max="90" value="${p.slow}"></div></div><div class="field full"><label for="btcapital">初始资金（元）</label><input id="btcapital" name="capital" type="number" step="1000" min="1000" value="${p.capital}"></div><div class="twonum full"><div class="field"><label for="btalloc">目标仓位（%）</label><input id="btalloc" name="alloc" type="number" min="1" max="100" value="${p.alloc}"></div><div class="field"><label for="btstop">止损阈值（%）</label><input id="btstop" name="stop" type="number" min="1" max="50" value="${p.stop}"></div></div><details class="full"><summary class="sub" style="cursor:pointer;font-size:12px">成本与撮合假设</summary><div class="twonum"><div class="field"><label for="btcost">每边综合成本率（%）</label><input id="btcost" name="cost" type="number" min="0" max="5" step=".01" value="${p.cost}"></div><div class="field"><label for="btslip">滑点（基点）</label><input id="btslip" name="slip" type="number" min="0" max="100" value="${p.slip}"></div></div><p class="tiny muted">1 基点 = 0.01%。这是自定假设，不是实际佣金或税率。买入按 100 股整手向下取整。</p></details><div class="notice full" style="margin-top:15px">使用合成 OHLC；不模拟涨跌停队列、市场冲击和成交量约束。不能作为真实策略绩效。</div><div class="error full" id="bterror" role="alert"></div><button type="submit" class="primary full" id="runbacktest" ${state.backtestRunning?'disabled':''}>${icon('play')}${state.backtestRunning?'正在运行…':'运行回测'}</button>${state.backtestRunning?'<button type="button" data-action="cancel-bt" class="quiet full">取消本次回测</button>':''}</form></section><section class="panel results" id="btresults"></section></div>`;$('#btstock').value=p.stock;if(state.backtestRunning)$$('input,select,[data-datepicker]', $('#btform')).forEach(el=>el.disabled=true);renderBTResults();}
function renderBTResults(){const r=state.backtest;if(state.backtestRunning){$('#btresults').innerHTML=`<div class="backtest-status" role="status">${icon('lab')}正在校验样本并顺序执行本地撮合…</div><div class="progress"><i style="width:48%"></i></div><div class="empty"><div class="skeleton" style="width:45%;margin:20px auto"></div><div class="skeleton" style="width:65%;margin:20px auto"></div><p>参数和可用时点已锁定，避免运行中变更结果。</p></div>`;return;}if(!r){$('#btresults').innerHTML=`<div class="panelhead"><h3>回测结果</h3><span class="tag">等待运行</span></div><div class="empty" style="padding:90px 24px">${icon('lab')}<h3>先定义条件，再观察结果</h3><p>调整左侧参数，运行一个可重复的本地回测。<br>收益、回撤、胜率和交易记录都从同一段样本计算。</p><div class="row wrap" style="justify-content:center;margin-top:23px"><span class="tag">下一日执行</span><span class="tag">显式成本假设</span><span class="tag">不读取未来数据</span></div></div><div class="panelbody"><div class="notice info">建议比较不同参数的表现，并观察交易次数和样本长度，而非只看收益。本原型不做参数寻优或真实策略推荐。</div></div>`;return;}
 const fullVisible=r.limit<=cut()&&r.params.end<=dates[cut()];if(!fullVisible){$('#btresults').innerHTML=`<div class="empty">${icon('clock')}<h3>该结果含有当前时点之后的数据</h3><p>为防止回放前视，旧结果已隐藏。请按当前时点重新回测。</p></div>`;return;}
 $('#btresults').innerHTML=`<div class="backtest-status"><span class="${state.backtestDirty?'amber':'accent'}">${icon(state.backtestDirty?'info':'check')}</span><span>${state.backtestDirty?'参数已修改 · 以下仍是上次运行结果':'计算完成 · 本地合成样本'}</span><span class="spacer"></span><button class="small quiet" data-action="export-bt">${icon('download')}导出结果</button></div><div class="statgrid"><div class="stat"><label>累计收益（含成本）</label><strong class="num ${cls(r.return)}">${signed(r.return)}%</strong><small>区间内，不是年化值</small></div><div class="stat"><label>最大回撤</label><strong class="num down">−${fmt(r.maxdd)}%</strong><small>按每日收盘净值</small></div><div class="stat"><label>已平仓胜率</label><strong class="num">${r.winrate===null?'—':fmt(r.winrate,1)+'%'}</strong><small>${r.closed} 笔已平仓，${r.wins} 笔盈利</small></div><div class="stat"><label>期末总资产</label><strong class="num">${unit(r.final)}</strong><small>仍持有 ${fmt(r.qty,0)} 股</small></div></div><div class="panelbody" style="padding-bottom:0"><div class="between"><h3>收益曲线</h3><span class="tiny muted">${getStock(r.params.stock).name} · ${r.params.start} — ${r.params.end}</span></div><div class="row tiny" style="margin-top:12px"><span class="accent">━ 策略净值（含成本）</span><span style="color:var(--blue)">┄ 同标的买入持有（不含费）</span></div></div><div class="equitychart"><canvas id="equitycanvas" role="img" aria-label="策略与买入持有收益曲线；全部精确值可导出"></canvas></div><div class="panelbody" style="padding-top:0"><div class="notice">${r.closed<10?'样本内已平仓交易少于 10 笔，胜率和收益都不稳定。':''} 该策略在同一合成样本内评估，未做样本外验证；不支持据此推断实盘收益。</div></div><div class="panelhead"><h3>成交明细 <span class="muted" style="font-size:12px">${r.trades.length} 笔</span></h3><span class="tiny muted">信号日 ≠ 执行日</span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>信号日期</th><th>执行日期</th><th>方向</th><th class="right">成交价</th><th class="right">数量（股）</th><th class="right">成本（元）</th></tr></thead><tbody>${r.trades.length?r.trades.map(t=>`<tr><td class="num muted">${t.signalDate}</td><td class="num">${t.date}</td><td class="${t.side==='买入'?'up':'down'}">${t.side}</td><td class="right num">${fmt(t.price)}</td><td class="right num">${fmt(t.qty,0)}</td><td class="right num">${fmt(t.fee)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">区间内未产生可成交的交叉条件。<p>零交易结果也是有效结果，不自动制造成交。</p></div></td></tr>`}</tbody></table></div><div class="panelbody tiny muted">配置快照：快线 ${r.params.fast} 日 / 慢线 ${r.params.slow} 日；仓位 ${r.params.alloc}%；成本率每边 ${r.params.cost}%；滑点 ${r.params.slip} 基点；止损阈值 ${r.params.stop}%。止损按日终触发，下一样本日开盘执行，不保证按阈值成交。</div>`;requestAnimationFrame(drawEquity);

function drawEquity(){const c=$('#equitycanvas'),r=state.backtest;if(!c||!r)return;const {ctx,w,h}=setupCanvas(c),C=colors(),a=r.curve,capital=r.params.capital,left=44,right=16,top=17,bottom=30;const vals=a.flatMap(d=>[(d.equity/capital-1)*100,(d.benchmark/capital-1)*100]);let lo=Math.min(0,...vals)-1,hi=Math.max(0,...vals)+1;const x=i=>left+i/(a.length-1)*(w-left-right),y=v=>top+(hi-v)/(hi-lo)*(h-top-bottom);ctx.clearRect(0,0,w,h);ctx.font='10px sans-serif';for(let i=0;i<5;i++){let v=hi-(hi-lo)*i/4,yy=y(v);ctx.strokeStyle=C.line2;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.fillStyle=C.muted;ctx.fillText(fmt(v,1)+'%',0,yy+3);}for(let i=0;i<5;i++){let j=Math.floor(i*(a.length-1)/4);ctx.fillStyle=C.muted;ctx.textAlign=i===0?'left':i===4?'right':'center';ctx.fillText(a[j].date.slice(5),x(j),h-7);}ctx.textAlign='left';for(const [key,col] of [['equity',C.accent],['benchmark',C.blue]]){ctx.strokeStyle=col;ctx.lineWidth=key==='equity'?2:1.3;ctx.setLineDash(key==='equity'?[]:[4,4]);ctx.beginPath();a.forEach((d,i)=>i?ctx.lineTo(x(i),y((d[key]/capital-1)*100)):ctx.moveTo(x(i),y((d[key]/capital-1)*100)));ctx.stroke();}ctx.setLineDash([]);}
function executeBT(){if(state.backtestRunning)return;const p=readBTForm(),err=validateBT(p);if(err){$('#bterror').textContent=err;$('#bterror').scrollIntoView({block:'nearest'});return;}state.backtestForm={...p};state.backtestRunning=true;const lockedCut=cut();renderBacktest();btTimer=setTimeout(()=>{try{state.backtest=runEngine(p,lockedCut);state.backtestDirty=false;state.backtestRunning=false;log('完成本地回测 '+getStock(p.stock).name);if(state.page==='backtest')renderBacktest();toast('回测完成：结果与配置快照已生成。');}catch(e){state.backtestRunning=false;if(state.page==='backtest'){renderBacktest();$('#bterror').textContent='计算未完成，请检查日期与参数后重试。';}console.error(e);}},850);}

const isPending=o=>['submitted','partial'].includes(o.status);const remaining=o=>o.qty-o.filled;
const orderStatus={submitted:'已委托',partial:'部分成交',filled:'全部成交',cancelled:'已撤单',partcancel:'部成部撤',expired:'已失效',partexpired:'部成失效'};
function positionQty(id){return(store.account.positions[id]?.lots||[]).reduce((n,l)=>n+l.qty,0);}
function eligibleQty(id){return(store.account.positions[id]?.lots||[]).filter(l=>l.session<store.account.session).reduce((n,l)=>n+l.qty,0);}
function sellAvailable(id,exclude=null){return eligibleQty(id)-store.orders.filter(o=>isPending(o)&&o.stock===id&&o.side==='sell'&&o.id!==exclude).reduce((n,o)=>n+remaining(o),0);}
function reserveCost(price,qty){const lotFee=Math.ceil(price*100*FEE*100)/100;return round(price*qty+lotFee*Math.ceil(qty/100));}
function accountSummary(){const reserved=round(store.orders.filter(o=>isPending(o)&&o.side==='buy').reduce((n,o)=>n+reserveCost(o.price,remaining(o)),0)),market=Object.entries(store.account.positions).reduce((n,[id,p])=>n+positionQty(id)*DATA[id][LAST].c,0);const cost=Object.values(store.account.positions).flatMap(p=>p.lots).reduce((n,l)=>n+l.cost*l.qty,0);return{cash:store.account.cash,free:round(store.account.cash-reserved),reserved,total:round(store.account.cash+market),market,cost,pnl:round(store.account.cash+market-100000)};}
function maxBuy(price,budget=accountSummary().free){return Math.max(0,Math.min(1e6,Math.floor(budget/reserveCost(price,100))*100));}
function tradeValidation(t){if(!permitted())return blockedReason();if(!Number.isFinite(t.price)||t.price<=0)return'请输入大于 0 的有效委托价格。';if(Math.abs(t.price*100-Math.round(t.price*100))>.00001)return'此样本最小报价单位为 0.01 元，最多输入两位小数。';const a=DATA[t.stock],prev=a[LAST-1].c,low=round(prev*.9),high=round(prev*1.1);if(t.price<low||t.price>high)return`委托价超出样本涨跌幅范围：${fmt(low)}～${fmt(high)} 元。`;if(!Number.isFinite(t.qty)||!Number.isInteger(t.qty)||t.qty<=0||t.qty>1e6)return'请输入 1～1,000,000 范围内的整数股数。';if(t.qty%100!==0)return'当前样本委托数量须为 100 股的整数倍。';if(t.side==='buy'&&reserveCost(t.price,t.qty)>accountSummary().free+.001)return`可用资金不足。按此价格最多可委托 ${fmt(maxBuy(t.price),0)} 股。`;if(t.side==='sell'&&t.qty>sellAvailable(t.stock))return`可卖数量不足：当前可卖 ${fmt(sellAvailable(t.stock),0)} 股。当轮买入的股份在下一结算轮次解锁。`;return'';}

function openFill(id){const o=store.orders.find(o=>o.id===id);if(!o||!isPending(o)||!permitted()){toast('该委托目前不可撮合。');return;}const price=DATA[o.stock][LAST].c,ok=o.side==='buy'?o.price>=price:o.price<=price;openDialog('手动撮合演练',`<span class="tag">${getStock(o.stock).name} · ${o.side==='buy'?'买入':'卖出'}</span><div class="kv"><span>委托限价</span><b>${fmt(o.price)} 元</b></div><div class="kv"><span>固定样本参考价</span><b>${fmt(price)} 元</b></div><div class="kv"><span>剩余可撮合数量</span><b>${fmt(remaining(o),0)} 股</b></div><div class="field"><label for="fillqty">本次成交数量（股）</label><input id="fillqty" type="number" step="100" min="100" max="${remaining(o)}" value="${remaining(o)}"><div class="quickqty" style="grid-template-columns:1fr 1fr"><button class="small" id="fill100">只撮合 100 股</button><button class="small" id="fillall">撮合全部剩余</button></div></div><div class="notice ${ok?'info':''}">${ok?'当前参考价满足限价。本次按参考价成交；只按指定数量做一次本地撮合。':'当前参考价不满足委托限价，不能成交。不会为了展示成功而强制撮合；可撤单后重新委托。'}<br>此模型不模拟买卖盘、队列、市场冲击或实际可成交量。</div><div class="error" id="fillerror" role="alert"></div>`,`<button data-action="close-dialog">取消</button><button class="primary" id="confirmfill" ${ok?'':'disabled'}>确认本次撮合</button>`);$('#fill100').onclick=()=>$('#fillqty').value=100;$('#fillall').onclick=()=>$('#fillqty').value=remaining(o);$('#confirmfill').onclick=()=>{const n=+$('#fillqty').value;const error=fillOrder(id,n);if(error){$('#fillerror').textContent=error;return;}closeDialog();renderTrading();toast(o.status==='filled'?'委托已全部成交。':'已部分成交；剩余数量仍可撮合或撤单。');};}
function fillOrder(id,n){const o=store.orders.find(o=>o.id===id);if(!o||!isPending(o))return'该委托已结束，请刷新状态。';if(!permitted())return blockedReason();if(!Number.isInteger(n)||n<=0||n%100||n>remaining(o))return'数量须为 100 股的整数倍，且不超过剩余委托。';const price=DATA[o.stock][LAST].c,fee=round(price*n*FEE),stamp=new Date().toISOString();if(o.side==='buy'&&price>o.price||o.side==='sell'&&price<o.price)return'样本参考价不满足限价，不能成交。';if(o.side==='buy'){if(store.account.cash+0.001<price*n+fee)return'模拟现金不足，撮合未执行。';store.account.cash=round(store.account.cash-price*n-fee);if(!store.account.positions[o.stock])store.account.positions[o.stock]={lots:[]};store.account.positions[o.stock].lots.push({qty:n,cost:(price*n+fee)/n,session:store.account.session});}else{if(sellAvailable(o.stock,o.id)<n)return'可卖数量不足；当轮买入股份不能当轮卖出。';let rem=n;const lots=store.account.positions[o.stock].lots;for(const l of lots){if(l.session>=store.account.session)continue;let take=Math.min(l.qty,rem);l.qty-=take;rem-=take;if(!rem)break;}store.account.positions[o.stock].lots=lots.filter(l=>l.qty>0);store.account.cash=round(store.account.cash+price*n-fee);}

function advanceSession(){if(state.replay){toast('请退出历史回放后再推进模拟结算。');return;}confirmDialog('推进模拟结算轮次',`<p>将账户从 <b>T${store.account.session}</b> 推进到 <b>T${store.account.session+1}</b>。</p><div class="notice">这不是预测下一交易日：行情价格保持不变。<br>本轮买入股份变为可卖；未完成委托按日终处理为失效，释放未成交部分的预占额。<br>已成交记录和成本保持不变。</div>`,()=>{for(const o of store.orders.filter(isPending)){o.status=o.filled?'partexpired':'expired';o.events.push({time:new Date().toISOString(),text:'结算演练：剩余委托到期失效，释放预占额'});}store.account.session++;save();log('推进结算轮次 T'+store.account.session);renderTrading();toast('结算演练完成：已解锁本轮可卖股份。');},'确认推进结算');}

function handleAction(action){switch(action){case'search':openSearch();break;case'guide':openGuide();break;case'notifications':if(state.replay)toast('历史回放中隐藏日终提醒。');else openNotifications();break;case'settings':switchPage('settings');break;case'close-dialog':closeDialog();break;case'favorite':toggleFavorite();break;case'alert':openAlert();break;case'check-alerts':checkAlerts();break;case'buy':openTrade('buy');break;case'sell':openTrade('sell');break;case'view-orders':closeDialog();state.tradeTab='orders';switchPage('trading');break;case'review-trade':{let t=readTrade(),err=tradeValidation(t);if(err){$('#tradeerror').textContent=err;return;}t.step='confirm';t.consent=false;renderTradeDialog();break;}case'edit-trade':state.trade.step='edit';renderTradeDialog();break;case'submit-trade':submitTrade();break;case'advance-session':advanceSession();break;case'export-orders':exportOrders();break;case'chart-data':openChartData();break;case'export-quotes':exportQuotes();break;case'export-bt':exportBT();break;case'evidence-backtest':closeDialog();switchPage('backtest');break;case'toggle-signals':state.signals=!state.signals;renderChartTab();break;case'toggle-replay':toggleReplay();break;case'exit-replay':stopReplay();state.replay=false;state.cursor=LAST;state.offset=0;render();break;case'replay-play':playReplay();break;case'replay-prev':stopReplay();replayMove(state.cursor-1);break;case'replay-next':stopReplay();replayMove(state.cursor+1);break;case'zoom-in':state.zoom=Math.max(30,state.zoom-20);state.offset=0;state.hover=-1;drawChart();break;case'zoom-out':state.zoom=Math.min(400,state.zoom+20);state.offset=0;state.hover=-1;drawChart();break;case'reset-chart':state.zoom=140;state.offset=0;state.hover=-1;drawChart();break;case'reset-watch':state.watchQuery='';state.watchFilter='all';state.watchGroup='all';renderResearch();break;case'retry':retryMarket();break;case'cancel-bt':clearTimeout(btTimer);state.backtestRunning=false;renderBacktest();toast('本次回测已取消，上次结果未变。');break;case'save-strategy':if(state.backtest&&!state.backtestDirty&&state.backtest.params.end<=dates[cut()]){store.strategy={...state.backtest.params};save();renderBacktest();toast('策略参数已保存，可通过“载入已存参数”恢复。');}break;case'load-strategy':if(store.strategy){state.backtestForm={...store.strategy,end:store.strategy.end>dates[cut()]?dates[cut()]:store.strategy.end};state.backtestDirty=true;renderBacktest();toast('已载入参数，重新运行后才会更新结果。');}break;case'export-notes':{const visible=Object.fromEntries(Object.entries(store.notes).filter(([k,v])=>k.slice(7)<=dates[cut()]));downloadText('WaveQuant_研究笔记.json',JSON.stringify(visible,null,2),'application/json');break;}case'export-workspace':if(state.replay){toast('回放期间不可导出包含日终账户的完整备份。请先退出回放。');return;}downloadText('WaveQuant_本地工作区备份.json',JSON.stringify({disclaimer:'合成行情与模拟账户，不是真实资金；本原型无导入恢复界面',...store},null,2),'application/json');break;case'reset-workspace':confirmDialog('重置本地工作区',`<p>将永久清除此浏览器中的自选修改、笔记、提醒、策略参数和全部模拟交易记录，并恢复初始的 10 万元模拟账户。</p><div class="notice">此操作不能撤销。需要保留数据时，请先取消并导出工作区备份。</div>`,()=>{stopReplay();clearTimeout(btTimer);store=defaults();state.replay=false;state.cursor=LAST;state.market='ready';state.backtest=null;state.backtestForm=null;state.backtestDirty=false;state.backtestRunning=false;state.trade=null;state.logs=[];save();render();toast('本地演示工作区已重置。');},'确认清空并重置',true);break;}}

function mPathFraction(s,d,k){
 const t=k/M_END, n=Math.sin(k*.107+s.i*1.9+d)*.022+Math.sin(k*.037+s.i)*.031;
 const start=.04+Math.sin(s.i*.73+d)*.09;
 const mode=(s.i+d)%12;
 const first=22+(s.i*9+d*7)%82;
 if(s.i===0)return k>=first?1:Math.min(.997,start+(1-start)*k/first+n*.5);
 if(mode===0||mode===1)return k>=first?1:Math.min(.997,start+(1-start)*k/first+n);
 if(mode===2){if(k>=first&&k<first+21||k>=first+62)return 1;if(k>=first+21&&k<first+62)return .75+n;return Math.min(.997,start+(1-start)*k/first+n);}
 if(mode===3){if(k>=first&&k<first+25)return 1;if(k>=first+25)return .67+n*2;return Math.min(.997,start+(1-start)*k/first+n);}
 if(mode===4)return k>=first+35?-1:Math.max(-.997,start-(1+start)*k/(first+35)+n*.4);
 if(mode===5)return start+(t*.66)+n;
 if(mode===6)return start-(t*.53)+n*2;
 if(mode===7)return start+(t*.32)+n*3;
 if(mode===8)return start-(t*.23)+n;
 if(mode===9)return start+Math.sin(t*8)*.19+n;
 if(mode===10)return k>195?1:Math.min(.997,start+k/197*(1-start)+n*.3);
 return start+Math.sin(t*6)*.1+n;
}
const M_DATA={};
for(const s of M_STOCKS){
 let base=850+s.i*79, history=[];
 for(let h=0;h<M_HISTORY.length;h++){
  const prev=base,seal=(s.i===0&&h>=2)||(s.i===10&&h>=3)||(s.i===22&&h>=4)||(s.i%12<3&&h===5);
  base=Math.round(prev*(seal?1+s.rate/100:1+Math.sin(s.i+h)*.018));
  history.push({date:M_HISTORY[h],prev,close:base,sealed:seal,amount:(2+s.i*.06)*1e8});
 }
 const days=[];
 for(let d=0;d<M_DATES.length;d++){
  let prevStreak=0;for(let h=history.length-1;h>=0&&history[h].sealed;h--)prevStreak++;
  const prev=base,upper=s.unrestricted?null:Math.round(prev*(100+s.rate)/100),lower=s.unrestricted?null:Math.round(prev*(100-s.rate)/100);
  let amount=0,volume=0,opens=0,first=null,last=null,touched=false,wasSeal=false;const points=[],events=[];
  const rand=rng(7721+s.i*23+d*343);
  for(let k=0;k<=M_END;k++){
   const fraction=mPathFraction(s,d,k);
   let p=Math.round(prev*(1+fraction*s.rate/100));
   const closeAuction=M_TIMES[k]>='14:57'&&M_TIMES[k]<'15:00',virtualClose=p;
   if(closeAuction&&points.length&&points.at(-1).p!==null)p=points.at(-1).p;
   if(upper!==null)p=Math.min(upper,Math.max(lower,p));
   const valid=k>0&&!s.suspended&&!s.missing;
   const sealed=valid&&upper!==null&&p===upper;
   const down=valid&&lower!==null&&p===lower;
   if(valid&&!closeAuction){const v=Math.round((1000+rand()*10000)*(1+s.i*.10)*(1+Math.abs(fraction)));volume+=v;amount+=v*p/100;}
   if(sealed&&!wasSeal){const type=touched?'回封':'首次封板';if(!touched)first=k;last=k;touched=true;events.push({id:`${d}-${s.id}-${k}-${type}`,d,k,stock:s.id,type,level:'关注'});}
   if(!sealed&&wasSeal){opens++;events.push({id:`${d}-${s.id}-${k}-炸板`,d,k,stock:s.id,type:'炸板',level:'风险'});}
   if(down&&!points.at(-1)?.down)events.push({id:`${d}-${s.id}-${k}-跌停`,d,k,stock:s.id,type:'跌停',level:'风险'});
   if(k===80+s.i%35&&valid&&!sealed)events.push({id:`${d}-${s.id}-${k}-量价异动`,d,k,stock:s.id,type:'量价异动',level:'观察'});

   points.push({k,p:valid?p:null,indicative:k===0&&!s.suspended&&!s.missing?p:null,auctionReference:closeAuction&&!s.suspended&&!s.missing?virtualClose:null,valid,sealed,down,touched,opens,first,last,amount:Math.round(amount),volume,bidQueue,wasBroken:touched&&!sealed,prevStreak,pct:valid?(p/prev-1)*100:null});
   wasSeal=sealed;
  }
  const close=points[M_END].p??prev;
  days.push({prev,upper,lower,prevStreak,points,events,history:[...history]});
  history.push({date:M_DATES[d],prev,close,sealed:points[M_END].sealed,amount:points[M_END].amount});base=close;
 }
 M_DATA[s.id]=days;
}

function mBreadth(st){const bins=[['≤ -7%',q=>q.pct<=-7],['-7 ~ -3%',q=>q.pct>-7&&q.pct<=-3],['-3 ~ 0%',q=>q.pct>-3&&q.pct<0],['平盘',q=>q.pct===0],['0 ~ 3%',q=>q.pct>0&&q.pct<3],['3 ~ 7%',q=>q.pct>=3&&q.pct<7],['≥ 7%',q=>q.pct>=7]];const ns=bins.map(([,f])=>st.valid.filter(f).length),max=Math.max(1,...ns);
 return `<div class="m-breadth"><div class="between"><strong class="up">上涨 ${st.up}</strong><span class="muted">平盘 ${st.flat}</span><strong class="down">下跌 ${st.down}</strong></div><div class="m-widthbar"><i style="flex:${st.up};background:var(--up)"></i><i style="flex:${st.flat};background:var(--muted)"></i><i style="flex:${st.down};background:var(--down)"></i></div><div class="m-bins">${bins.map(([l],i)=>`<button data-m-bin="${i}" title="筛选 ${l}"><b>${ns[i]}</b><i style="height:${12+ns[i]/max*72}px;background:${i<3?'var(--down)':i===3?'var(--muted)':'var(--up)'}"></i><small>${l}</small></button>`).join('')}</div><div class="m-footnote">未计入：${st.total-st.valid.length} 只停牌 / 缺失 / 无成交。可点柱查看成分。</div></div>`;
}
function mHeatmap(){const data=mSectors(),total=data.reduce((a,b)=>a+b.amount,0);return `<div class="m-heatmap">${data.map((s,i)=>`<button class="m-heat ${cls(s.pct)} ${mState.theme===s.g?'selected':''}" style="flex-grow:${Math.max(.1,s.amount/(total||1)*100)};--heat:${Math.min(.32,.09+Math.abs(s.pct||0)/65)}" data-m-theme="${s.g}" title="点击联动 ${s.name}"><strong>${s.name}</strong><b class="num">${mPct(s.pct)}</b><small>${s.sealed.length} 封板 · ${unit(s.amount)}元</small></button>`).join('')}</div><div class="m-footnote">面积 ≈ 成交额 · 色彩 = 成分等权涨跌幅 · 概念有交叉，不能加总。</div>`;}
function mLadderCards(compact=false){const all=mQuotes().filter(q=>q.sealed),heights=[6,5,4,3,2,1];return `<div class="m-ladder ${compact?'compact':''}">${heights.map(h=>{const rows=all.filter(q=>h===6?q.streak>=6:q.streak===h);return `<div class="m-rung"><button class="m-runglabel" data-m-height="${h}"><b>${h===1?'首':h===6?'6+':h}</b><span>${h===1?'板':'板'} · ${rows.length} 只</span></button><div class="m-rungstocks">${rows.length?rows.map(q=>`<button class="m-ladderstock" data-m-stock="${q.id}"><strong>${q.name}</strong><span class="up">${mPct(q.pct)}</span><small>${M_BOARDS[q.board].label} · ${M_THEMES[q.g]} · ${q.streak}板${mState.time===M_END?'':'暂定'}</small></button>`).join(''):'<span class="muted tiny">此梯队暂无样本</span>'}</div></div>`;}).join('')}</div>`;}
function mRadarRows(events,limit=8){return `<div class="m-eventlist">${events.slice(0,limit).map(e=>{const s=M_BYID[e.stock];return `<button class="m-event ${mStore.read.includes(e.id)?'read':''}" data-m-event="${e.id}"><time>${M_TIMES[e.k]}</time><div><span class="tag ${e.level==='风险'?'amber':'m-red'}">${e.type}</span><strong>${s.name}</strong><small>${M_THEMES[s.g]} · ${e.level}事件${mStore.read.includes(e.id)?' · 已读':''}</small></div>${icon('chevron')}</button>`;}).join('')||'<div class="m-empty">当前时点暂无事件</div>'}</div>`;}
function mWatchRail(){const ids=mStore.groups[mState.group];return mPanel('我的观察',`<div class="m-pad"><select data-m-group aria-label="观察分组">${Object.keys(mStore.groups).map(g=>`<option ${mState.group===g?'selected':''}>${g}</option>`).join('')}</select><div class="m-watchlist">${ids.map(id=>{const q=mQuote(id);return `<div><button class="link" data-m-stock="${id}">${q.name}</button><b class="num ${cls(q.pct)}">${mPct(q.pct)}</b><button class="iconbtn small ghost" data-m-remove="${id}" title="移出当前组" aria-label="将${q.name}移出${mState.group}">${icon('close')}</button></div>`;}).join('')||'<p class="tiny muted">把待验证的标的加入这里。</p>'}</div><button class="small quiet full" data-m-export="watch">${icon('download')}导出本组可见行情</button></div>`,`<span class="tiny muted">${ids.length} 只</span>`);}
function mOverview(){const st=mStats(),ids=mUniverse().map(s=>s.id),sectors=[...mSectors()].sort((a,b)=>(b.pct??-Infinity)-(a.pct??-Infinity)),leader=sectors[0];return mKpis(st)+`<div class="m-dashboard"><div class="m-wide">${mPanel('大盘与市场广度',`<div class="m-mainchart"><div><div class="m-chartsummary"><b class="num ${cls(st.mean)}">${mPct(st.mean)}</b><span>当前范围 · 成分等权</span></div>${mChart([mSeries(ids),mSeries(mUniverse({theme:false}).map(s=>s.id))],['当前范围','全范围基准'])}</div>${mBreadth(st)}</div>`,`<button class="small ghost" data-m-rules>统计口径 ${icon('info')}</button>`)}<div class="m-halves">${mPanel('板块热力',mHeatmap(),`<button class="link" data-m-tab="sectors">轮动分析 ${icon('arrow')}</button>`)}${mPanel('涨停阶梯',mLadderCards(true),`<button class="link" data-m-tab="ladder">展开 ${icon('arrow')}</button>`)}</div>${mPanel('行情排行',mStockTable(mSorted(mQuotes()).slice(0,10)),`<div class="row"><span class="tiny muted">当前范围 · 涨幅前 10</span><button class="small quiet" data-m-all>完整行情</button></div>`)}</div><aside class="m-rail">${mPanel('盘中异动',mRadarRows(mEvents(),6),`<button class="link" data-m-tab="radar">全部</button>`)}${mPanel('主线观察',`<div class="m-pad"><span class="tiny muted">全板块对照 · 等权涨幅第一 · 非买入推荐</span><button class="m-storytitle" data-m-theme="${leader.g}">${leader.name} ${icon('arrow')}</button><div class="m-storymetrics"><div><b class="up">${mPct(leader.pct)}</b><small>成分等权</small></div><div><b>${leader.sealed.length}/${leader.valid.length}</b><small>封板 / 有效成分</small></div></div><p class="tiny sub">看扩散是否持续，也看炸板与未兑现风险。不把热度当成确定性。</p><button class="small quiet full" data-m-tab="themes">查看催化与反向证据</button></div>`)}${mWatchRail()}</aside></div>`;}
function mSectorView(){const sectors=mSectors();return `<div class="m-sectionhead"><div><h2>板块轮动</h2><p>分清涨幅、扩散与成交占比，而不只追逐榜首。</p></div><div class="row"><button class="small ${mState.industry?'':'active'}" data-m-classify="concept">概念题材</button><button class="small ${mState.industry?'active':''}" data-m-classify="industry">行业分类</button><select data-m-sector-sort aria-label="板块排序"><option value="pct" ${mState.metric==='pct'?'selected':''}>按等权涨幅</option><option value="amount" ${mState.metric==='amount'?'selected':''}>按成交额</option></select><button class="small quiet" data-m-sort-direction>${mState.desc?'降序 ↓':'升序 ↑'}</button></div></div><div class="m-halves">${mPanel('成交额热力分布',mHeatmap())}${mPanel('同一盘中时刻 · 三日强弱',`<div class="m-pad"><div class="m-rotation"><div class="m-rot-head">板块</div>${M_DATES.map((d,i)=>`<div class="m-rot-head">${d.slice(5)}${i>mState.day?' · 未到':''}</div>`).join('')}${sectors.map(s=>`<button class="link" data-m-theme="${s.g}">${s.name}</button>${M_DATES.map((_,d)=>{const r=d<=mState.day?mSectors(d,mState.time).find(x=>x.g===s.g):null;return `<button class="m-rotcell ${r?cls(r.pct):''}" ${r?`data-m-rotation="${d},${s.g}"`:'disabled'}>${r?mPct(r.pct):'未来不可见'}</button>`;}).join('')}`).join('')}</div><p class="m-footnote">等权收益而非名次颜色；无真实指数编制。历史成分在本演示中固定。</p></div>`)}</div>${mPanel('板块行情与扩散',`<div class="tablewrap"><table class="data-table m-table"><thead><tr><th>板块</th><th>等权涨幅</th><th>有效 / 全部</th><th>上涨占比</th><th>封板 / 触板</th><th>成交额</th><th>观察入口</th></tr></thead><tbody>${sectors.map(s=>`<tr><td><button class="link" data-m-theme="${s.g}">${s.name}</button></td><td class="num ${cls(s.pct)}">${mPct(s.pct)}</td><td>${s.valid.length}/${s.total}</td><td>${s.valid.length?fmt(s.up/s.valid.length*100,1)+'%':'—'}</td><td>${s.sealed.length} / ${s.touched.length}</td><td class="num">${unit(s.amount)}元</td><td><button class="small" data-m-sector-detail="${s.g}">成分与证据</button></td></tr>`).join('')}</tbody></table></div>`)}${mState.theme!==null?mPanel(mScopeName()+' · 当前联动成分',mStockTable(mSorted(mQuotes()))):''}`;}
function mThemeView(){const sectors=mSectors().filter(s=>mState.theme===null||s.g===mState.theme);return `<div class="m-sectionhead"><div><h2>热点题材 · 证据链</h2><p>市场表现与事件证据并排看；演示资讯全部虚构，不对应真实公司事件。</p></div><button class="small quiet" data-m-rules>口径与去重规则</button></div><div class="m-themegrid">${sectors.map((s,i)=>{const news=mNews().filter(n=>n.g===s.g);const leader=mSorted(s.rows.filter(q=>q.valid))[0];return mPanel(`<span class="m-rank">${String(i+1).padStart(2,'0')}</span>${s.name}`,`<div class="m-pad"><div class="m-themeheadline"><b class="num ${cls(s.pct)}">${mPct(s.pct)}</b><span>${s.sealed.length} 封板 / ${s.valid.length} 有效</span></div>${mChart([mSeries(s.rows.map(q=>q.id))],[s.name],50,true)}<div class="m-themefacts"><span>上涨扩散 <b>${s.valid.length?fmt(s.up/s.valid.length*100,0)+'%':'—'}</b></span><span>炸板未封 <b class="amber">${s.broken.length}</b></span><span>率先封板 <b>${s.sealed.length?M_TIMES[Math.min(...s.sealed.map(q=>q.first))]:'—'}</b></span></div><div class="m-newscards">${news.slice(0,2).map(n=>`<button data-m-news="${n.id}"><span class="tag ${n.kind==='反向证据'?'amber':'teal'}">${n.kind}</span><strong>${n.title}</strong><small>${M_TIMES[n.available]} 可见 · ${n.source}</small></button>`).join('')||'<p class="muted tiny">此时点尚无可见资讯，不补写上涨原因。</p>'}</div><div class="between m-themebottom"><button class="link" ${leader?`data-m-stock="${leader.id}"`:'disabled'}>领涨候选：${leader?.name||'—'}</button><button class="small" data-m-theme="${s.g}">联动题材</button></div></div>`);}).join('')}</div>`;}
function mAdvance(){const q=mQuotes().filter(x=>!x.unrestricted);return `<div class="m-advance">${[1,2,3,4].map(n=>{const cohort=q.filter(x=>x.prevStreak===n),success=cohort.filter(x=>x.sealed),unknown=cohort.filter(x=>!x.valid).length,rate=cohort.length&&!unknown?success.length/cohort.length*100:null;return `<button data-m-cohort="${n}"><span>${n} 进 ${n+1}${n===4?'（昨 4 板）':''}</span><strong>${mRate(rate)}</strong><small>${success.length} / ${cohort.length} 只${unknown?' · '+unknown+' 未知':''} · ${mState.time===M_END?'收盘确认':'盘中暂定'}</small></button>`;}).join('')}</div>`;}
function mLadderView(){let rows=mQuotes().filter(q=>q.valid&&!q.unrestricted);const pools={sealed:'当前封板',broken:'炸板未封',touched:'曾经触板',previous:'昨日涨停',down:'当前跌停'};rows=rows.filter(q=>mState.pool==='sealed'?q.sealed:mState.pool==='broken'?q.wasBroken:mState.pool==='touched'?q.touched:mState.pool==='previous'?q.prevStreak>0:q.down);if(mState.height)rows=rows.filter(q=>mState.height===6?q.streak>=6:q.streak===mState.height);
 return `<div class="m-sectionhead"><div><h2>涨停阶梯 · 强弱接力</h2><p>同一日内状态与收盘确认分开；10%、20%、30% 样本请用顶部市场筛选分开比较。</p></div><button class="small quiet" data-m-rules>连板 / 炸板率 / 晋级率</button></div>${mAdvance()}${mYesterdayBar()}<div class="m-notice">${mState.time===M_END?'收盘样本：连续涨停以每日收盘确认。':'盘中观察：卡片的“暂定连板”不代表已经收盘涨停。'}晋级分母固定为前一日对应梯队；缺失数据在明细中单列，不能当成晋级失败。</div>${mPanel('高度阶梯',mLadderCards())}${mPanel('涨跌停股票池',`<div class="m-poolbar">${Object.entries(pools).map(([k,v])=>`<button class="small ${mState.pool===k?'active':''}" data-m-pool="${k}">${v}</button>`).join('')}${mState.height?`<button class="small amber" data-m-height="0">高度 ${mState.height}+ ×</button>`:''}<span class="spacer"></span><span class="tiny muted">${rows.length} 只</span><button class="small quiet" data-m-export="pool">导出此池</button></div>${mStockTable(rows.sort((a,b)=>b.streak-a.streak||(a.first??999)-(b.first??999)))}<div class="m-footnote">当前范围炸板率：${mStats().broken.length} 只炸板未回封 ÷ ${mStats().touched.length} 只曾触板 = ${mRate(mStats().brokenRate)}。不同股票池不改变这个统计分母。</div>`)}`;}
function mLeaderView(){const q=mQuotes().filter(x=>x.valid),sealed=q.filter(x=>x.sealed);const roles=[{title:'高度龙头候选',subtitle:'当前封板 · 连板高度优先',rows:[...sealed].sort((a,b)=>b.streak-a.streak||(a.first??999)-(b.first??999)),value:x=>x.streak+' 板'+(mState.time===M_END?'':' · 暂定'),desc:'先看昨日已确认高度，再看今天是否仍封板；同高度按首封时间展示，不能证明带动关系。'},{title:'成交中军候选',subtitle:'成交额优先 · 不等于净流入',rows:[...q].sort((a,b)=>b.amount-a.amount),value:x=>unit(x.amount)+'元',desc:'大成交额代表交易活跃，不表示资金净买入；需同时核查涨幅、换手、容量及板块扩散。'},{title:'日内领涨候选',subtitle:'当前相对昨收涨幅优先',rows:mSorted(q),value:x=>mPct(x.pct),desc:'这是收益排序，不是主观龙头认证。不同涨跌幅制度会影响名次，应先限制可比范围。'},{title:'率先封板候选',subtitle:'曾触板 · 首次到达涨停价时间',rows:q.filter(x=>x.touched).sort((a,b)=>a.first-b.first),value:x=>M_TIMES[x.first],desc:'首封早并不代表封单可靠；同时显示是否炸板、当前回封情况以及可见的反向证据。'}];
 return `<div class="m-sectionhead"><div><h2>龙头观察 · 四种角色，不合成神秘分数</h2><p>每个候选都能展开依据；无“必涨”“主力认定”或上涨概率。</p></div><button class="small quiet" data-m-tab="multi">多股比较 ${icon('arrow')}</button></div><div class="m-leadergrid">${roles.map((r,i)=>mPanel(r.title,`<div class="m-pad"><p class="tiny muted">${r.subtitle}</p>${r.rows.slice(0,4).map((x,j)=>`<div class="m-leaderrow"><span class="m-rank ${j?'':'accent'}">${String(j+1).padStart(2,'0')}</span><button class="link" data-m-stock="${x.id}">${x.name}<small>${M_THEMES[x.g]} · ${M_BOARDS[x.board].label}</small></button><b class="num ${i===2?cls(x.pct):''}">${r.value(x)}</b><button class="iconbtn small" data-m-addmulti="${x.id}" aria-label="将${x.name}加入多屏" title="加入多屏">${icon('plus')}</button></div>`).join('')||'<div class="m-empty">无符合条件的样本</div>'}<div class="m-footnote">${r.desc}</div></div>`,`<span class="tag">可核验</span>`)).join('')}</div>${mPanel('失效条件先写清楚',`<div class="m-riskgrid"><div><h4>高度失效</h4><p>当前开板、跨日断板、风险状态变化。不要只看历史最高板数。</p></div><div><h4>主线分歧</h4><p>板块上涨占比下降，炸板扩散，反向证据出现。对照同一观察时刻。</p></div><div><h4>价格强不等于可成交</h4><p>封单可以撤销；快照看不到你的排队顺序，更不能保证成交。</p></div></div>`)}`;}
function mRadarView(){let events=mEvents().filter(e=>mState.radarType==='all'||e.type===mState.radarType).filter(e=>mState.radarScope==='all'||Object.values(mStore.groups).some(a=>a.includes(e.stock)));let pending=0;if(mState.radarFrozen){pending=events.filter(e=>!mState.radarFrozen.includes(e.id)).length;events=events.filter(e=>mState.radarFrozen.includes(e.id));}
 return `<div class="m-sectionhead"><div><h2>异动雷达 · 事件时间优先</h2><p>只读取截至当前时点的事件；回放推进才产生新的可见条目，不冒充后台实时监控。</p></div><div class="row"><button class="small ${mState.radarFrozen?'active':''}" data-m-freeze>${mState.radarFrozen?'恢复插入 · '+pending+' 条新事件':'暂停新事件插入'}</button><button class="small quiet" data-m-readall>当前列表标记已读</button></div></div><div class="m-poolbar"><select data-m-radar-type aria-label="异动类型">${['all','首次封板','回封','炸板','跌停','量价异动'].map(k=>`<option value="${k}" ${mState.radarType===k?'selected':''}>${k==='all'?'全部类型':k}</option>`).join('')}</select><select data-m-radar-scope aria-label="异动范围"><option value="all">当前市场范围</option><option value="watch" ${mState.radarScope==='watch'?'selected':''}>仅我的观察组</option></select><span class="tag">${events.length} 条可见</span><span class="spacer"></span><button class="small quiet" data-m-export="events">导出可见事件</button></div><div class="m-dashboard"><div class="m-wide">${mPanel('异动流水',mRadarRows(events,200),`<span class="tiny muted">${mState.radarFrozen?'固定当前事件集合，快照仍可推进':'按事件发生时间倒序'}</span>`)}</div><aside class="m-rail">${mWatchRail()}${mPanel('提醒边界',`<div class="m-pad"><p class="sub">这里是本地事件查看器，不会发送短信、桌面通知或交易指令。</p><p class="tiny muted">生产版：交易所行情 → 规则引擎 → 去重 / 冷却 → 分组订阅 → 通知回执。消息聚合和静音时段应在服务端生效。</p></div>`)}</aside></div>`;}
function mMultiView(){const count=mStore.columns,ids=[...mStore.multi];while(ids.length<count)ids.push(M_STOCKS[ids.length].id);return `<div class="m-sectionhead"><div><h2>多股同屏 · 共用时钟</h2><p>共用 ±36% 样本百分比刻度，悬停同步时间；点击名称展开详情，不丢失比较上下文。</p></div><div class="row">${[4,6,9].map(n=>`<button class="small ${n===count?'active':''}" data-m-columns="${n}">${n} 宫格</button>`).join('')}<button class="small quiet" data-m-watchmulti>载入当前观察组</button></div></div><div class="m-multigrid" style="--cols:${count===4?2:3}">${ids.slice(0,count).map((id,i)=>{const q=mQuote(id);return mPanel(`<button class="link" data-m-stock="${id}">${q.name}</button>`,`<div class="m-pad"><div class="between"><div><b class="num ${cls(q.pct)}">${mNum(q.price)}　${mPct(q.pct)}</b><small class="muted">${id} · ${M_THEMES[q.g]}</small></div>${mBadge(q)}</div>${mChart([mSeries([id]),mSeries(mUniverse({theme:false}).map(s=>s.id))],[q.name,'全范围等权'],190)}</div>`,`<select data-m-multislot="${i}" aria-label="第${i+1}屏股票">${M_STOCKS.map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${s.name}</option>`).join('')}</select>`);}).join('')}</div>`;}
function mReviewText(){const st=mStats(),sectors=mSectors(),note=mStore.notes[M_DATES[mState.day]]||'';return `# WaveQuant ${mState.time===M_END?'盘后复盘':'盘中观察快照'}\n\n数据：完全虚构样本 wq-market-fixture-2.0，非真实行情，不构成投资建议。\n截止：${mAsOf()}\n状态：${mState.quality}\n范围：${mState.board}，${mState.theme===null?'所有题材':mScopeName()}，${mState.risk?'包含':'排除'}风险标的\n\n## 市场结构\n有效 ${st.valid.length}/${st.total}；上涨 ${st.up}、下跌 ${st.down}、平盘 ${st.flat}。\n当前封板 ${st.sealed.length}；曾触板 ${st.touched.length}；炸板未回封 ${st.broken.length}；炸板率 ${mRate(st.brokenRate)}。\n当前跌停 ${st.limitDown}；市场高度 ${st.height} 板（${mState.time===M_END?'收盘确认':'盘中暂定'}）。\n成交额 ${unit(st.amount)} 元，按证券去重，不相加概念成交额。\n\n## 板块观察（排序不受题材联动筛选，受市场范围影响）\n${sectors.slice(0,5).map(s=>`- ${s.name}：等权 ${mPct(s.pct)}，封板 ${s.sealed.length}/${s.valid.length}，炸板未封 ${s.broken.length}`).join('\n')}\n\n## 可见事件\n${mEvents().slice(0,12).map(e=>`- ${M_TIMES[e.k]} ${M_BYID[e.stock].name} ${e.type}`).join('\n')}\n\n## 研究笔记（人工记录，非系统判断）\n${note||'尚未填写。'}\n\n## 下一轮验证\n1. 主线扩散是否保持？\n2. 高度候选是否断板或炸板？\n3. 催化是否有正式来源，反向证据是否改变假设？\n\n本报告只包含当前可见行情与事件；不是自动交易方案。\n`;}
function mReviewView(){const st=mStats();return `<div class="m-sectionhead"><div><h2>${mState.time===M_END?'盘后复盘':'盘中观察 · 尚未收盘'}</h2><p>报告与屏幕使用同一份快照；收盘前不生成“收盘定论”。</p></div><button class="primary" data-m-export="review">${icon('download')}导出 ${mState.time===M_END?'复盘':'观察'}报告</button></div>${mState.time<M_END?'<div class="m-notice">现在仍是盘中样本。点击顶部“盘后”可查看收盘确认结果，但不能用于之前时点的判断。</div>':''}<div class="m-halves">${mPanel('结构化观察',`<div class="m-pad"><div class="m-reviewnums"><div><span>有效样本</span><b>${st.valid.length}/${st.total}</b></div><div><span>${mState.time===M_END?'收盘':'当前'}封板</span><b class="up">${st.sealed.length}</b></div><div><span>炸板未封</span><b class="amber">${st.broken.length}</b></div><div><span>高度</span><b>${st.height} 板</b></div></div><div class="m-reviewlines">${mSectors().slice(0,5).map((s,i)=>`<div><span>${i+1}</span><button class="link" data-m-theme="${s.g}">${s.name}</button><b class="${cls(s.pct)}">${mPct(s.pct)}</b><small>${s.sealed.length} 封板</small></div>`).join('')}</div><p class="m-footnote">只描述观察到的事实。不自动判断“冰点反转”“赚钱效应确定”，不建议仓位。</p></div>`)}${mPanel('我的复盘笔记',`<div class="m-pad"><label for="m-notes" class="tiny muted">${M_DATES[mState.day]} · 人工笔记（跨时点保留，不参与历史计算）</label><textarea id="m-notes" rows="8" maxlength="10000" placeholder="写下主线假设、反向证据、失效条件，以及下一轮要验证什么。">${esc(mStore.notes[M_DATES[mState.day]]||'')}</textarea><div class="between tiny muted"><span id="m-note-status">输入自动保存到当前浏览器</span><span>不上传服务器</span></div></div>`)}</div>${mPanel('报告预览',`<pre class="m-report" id="m-report">${esc(mReviewText())}</pre>`)}`;}
function renderMarket(){
 const st=mStats();document.body.classList.add('market-view');
 $('#main').innerHTML=`<div class="m-header"><div><div class="m-eyebrow">MARKET INTELLIGENCE / 看盘工作台</div><h1>市场看盘<span class="m-headtag">大盘 → 主线 → 个股 → 验证</span></h1></div><div class="row"><button class="quiet" data-m-quality>${icon('shield')}数据状态</button><button class="quiet" data-m-export="snapshot">${icon('download')}保存快照</button><button class="primary" data-m-search>${icon('search')}找股票 / 题材</button></div></div><div class="m-contextbar"><label>样本日期 <select data-m-day ${mState.quality!=='ok'?'disabled':''} aria-label="样本日期">${M_DATES.map((d,i)=>`<option value="${i}" ${i===mState.day?'selected':''}>${d}</option>`).join('')}</select></label><div class="m-phases">${[['09:20','竞价'],['10:30','早盘'],['14:30','盘中'],['15:00','盘后']].map(([tm,n])=>`<button class="small ${M_TIMES[mState.time]===tm?'active':''}" data-m-time="${M_TIMES.indexOf(tm)}" ${mState.quality!=='ok'?'disabled':''}>${n}</button>`).join('')}</div><button class="iconbtn small" data-m-play ${mState.quality!=='ok'?'disabled':''} aria-label="${mState.playing?'暂停':'播放'}样本时间轴">${icon(mState.playing?'pause':'play')}</button><input class="m-time" type="range" data-m-timeline ${mState.quality!=='ok'?'disabled':''} min="0" max="${M_END}" value="${mState.time}" aria-label="全看盘系统统一样本时点"><strong class="num m-time-label" id="m-time-label">${M_TIMES[mState.time]}</strong><span class="tag ${mState.time===M_END?'teal':'amber'}">${mState.time===0?'虚拟竞价参考':mState.time===M_END?'收盘快照':M_TIMES[mState.time]>='14:57'?'收盘竞价 · 成交价保留':'历史盘中样本'}</span></div><div class="m-scopebar"><label>市场 <select data-m-board aria-label="市场范围"><option value="all">全样本市场</option>${Object.entries(M_BOARDS).map(([k,b])=>`<option value="${k}" ${mState.board===k?'selected':''}>${b.label} · ${b.rate}% 样本</option>`).join('')}</select></label><label class="m-check"><input type="checkbox" data-m-risk ${mState.risk?'checked':''}>含风险标的</label>${mState.theme!==null?`<button class="small active" data-m-cleartheme>${mState.scopeType==='industry'?'行业':'题材'}：${mScopeName()} ${icon('close')}</button>`:'<span class="tiny muted">全部题材 · 排除项与缺失数可追溯</span>'}<span class="spacer"></span><span class="tiny muted">48 只虚构证券 · 非全市场覆盖</span><button class="small ghost" data-m-rules>口径说明</button></div>${mState.quality!=='ok'?`<div class="m-notice">${mState.quality==='stale'?'过期状态演练：保留最后快照，所有结论仅代表该时点。':mState.quality==='partial'?'部分失败演练：该快照本身已包含停牌及缺失证券；不以 0 补齐。':'权限说明演练：未接入 Level-2，队列及逐笔委托字段不提供。'} <button class="link" data-m-recover>恢复样本状态</button></div>`:''}${mState.time===0?'<div class="m-notice">09:20 仅为虚拟竞价参考，不是成交价。价格、成交额、市场广度与涨停统计暂不计入；个股详情可查看虚拟参考价。</div>':''}${mIndexStrip()}<div class="m-tabs" role="tablist" aria-label="看盘功能">${Object.entries(M_TABNAMES).map(([k,n])=>`<button role="tab" aria-selected="${mState.tab===k}" class="${mState.tab===k?'active':''}" data-m-tab="${k}">${n}${k==='radar'?`<small>${mEvents().length}</small>`:''}</button>`).join('')}</div><div class="m-content" id="m-content" role="tabpanel" aria-label="${M_TABNAMES[mState.tab]}">${({overview:mOverview,sectors:mSectorView,themes:mThemeView,ladder:mLadderView,leaders:mLeaderView,radar:mRadarView,multi:mMultiView,review:mReviewView})[mState.tab]()}</div>`;
 $('#crumb').textContent='市场看盘 / '+M_TABNAMES[mState.tab];$('#upcount').textContent=st.up+' 只';$('#downcount').textContent=st.down+' 只';$('#contextclock').textContent=M_DATES[mState.day]+' '+M_TIMES[mState.time]+' · 统一样本时点';$('#footerstate').innerHTML=`<span class="accent"><i class="dot"></i> 看盘 v2 · 虚构样本</span>　<span>${mAsOf()}</span>　<span>${mStorageOK?'本地保存可用':'保存不可用，请导出'}</span>`;
 mBindCharts();
}

function mYesterdayBar(){const q=mQuotes().filter(q=>!q.unrestricted),groups=[['昨日涨停表现',q.filter(x=>x.prevStreak>0),'previous'],['昨日连板表现',q.filter(x=>x.prevStreak>=2),'prevchain']];return `<div class="m-yesterday">${groups.map(([title,cohort,key])=>{const valid=cohort.filter(x=>x.valid),pct=mMean(valid.map(x=>x.pct));return `<button data-m-yesterday="${key}"><span>${title}</span><b class="num ${cls(pct)}">${mPct(pct)}</b><small>昨收 → 当前价 · 有效 ${valid.length}/${cohort.length} 只 · 等权</small></button>`;}).join('')}<div><b>先固定昨日队列，再看今天表现</b><p>这是价格表现，不是开盘买入收益；剔除及缺失有明细。点击可对账。</p></div></div>`;}

function mStop(){clearInterval(mTimer);mTimer=null;mState.playing=false;}
function mSetTime(t,day=mState.day){if(mState.quality!=='ok'){toast('先恢复数据状态，再推进样本时钟。');return;}t=Math.max(0,Math.min(M_END,Number(t)));if(day!==mState.day||t<mState.time)mState.radarFrozen=null;mState.day=Number(day);mState.time=t;mState.height=0;renderMarket();}
function mTab(tab,push=true){if(!M_TABNAMES[tab])return;if(state.playing)stopReplay();if(tab==='themes')mState.industry=false;mState.tab=tab;state.page='market';if(push)try{history.pushState({marketTab:tab},'', '#market/'+tab);}catch(e){}render();}
function mDialog(title,body,foot='',drawer=false){mStop();openDialog(title,body,foot||'<button data-action="close-dialog">关闭</button>',drawer);const b=$('[data-m-play]');if(b){b.innerHTML=icon('play');b.setAttribute('aria-label','播放样本时间轴');}}
function mOpenStock(id,view='intraday'){if(!M_BYID[id])return;const q=mQuote(id),day=mDay(id),peers=mUniverse({theme:false}).filter(s=>s.themes.includes(q.g)).map(s=>s.id);mState.selected=id;
 let plot='';if(view==='daily'){
  const history=day.history,pts=[...history.map(x=>(x.close/history[0].prev-1)*100),...(q.valid?[(q.p/day.history[0].prev-1)*100]:[])];
  const max=Math.max(1,...pts.map(Math.abs)),w=760,h=175;const path=pts.map((v,i)=>`${i?'L':'M'}${20+i/Math.max(1,pts.length-1)*720},${145-v/max*115}`).join(' ');
  plot=`<svg viewBox="0 0 ${w} ${h}" class="m-chart" role="img" aria-label="历史收盘走势"><path d="${path}" stroke="var(--accent)" fill="none" stroke-width="2"/><text x="20" y="170" fill="var(--muted)" font-size="12">${history[0].date}</text><text x="580" y="170" fill="var(--muted)" font-size="12">截至 ${M_DATES[mState.day]}</text></svg><div class="m-footnote">历史收盘序列；最后一点为当前盘中价，不冒充已收盘日 K。不复权的虚构价格。</div>`;
 }else plot=mChart([mSeries([id]),mSeries(peers)],[q.name,M_THEMES[q.g]+'等权'],230);
 const validPoints=day.points.slice(1,mState.time+1).filter(p=>p.valid),high=validPoints.length?Math.max(...validPoints.map(p=>p.p))/100:null,low=validPoints.length?Math.min(...validPoints.map(p=>p.p))/100:null;
 const details=[['昨收',fmt(q.prev/100)+' 元'],['今开',mNum(day.points[1].p===null?null:day.points[1].p/100)+' 元'],['最高 / 最低',mNum(high)+' / '+mNum(low)],['成交额',q.valid?unit(q.amount)+' 元':'—'],['换手率',q.valid?fmt(q.turnover)+'%':'—'],['涨停 / 跌停价',q.upper===null?'无限价样本':fmt(q.upper/100)+' / '+fmt(q.lower/100)],['昨确认连板',q.prevStreak+' 板'],['今暂定 / 收盘确认',mState.time===M_END?q.confirmed+' 板（收盘）':q.streak+' 板（暂定）'],['首次 / 最近封板',`${q.first===null?'—':M_TIMES[q.first]} / ${q.last===null?'—':M_TIMES[q.last]}`],['开板次数',q.opens+' 次']];
 mDialog(q.name+' · 个股验证',`<div class="m-detailhead"><div><span class="tiny muted">${id} · 虚构证券 · ${M_BOARDS[q.board].label}</span><div class="m-detailprice num ${cls(q.pct)}">${mNum(q.price)} <small>${mPct(q.pct)}</small></div>${mBadge(q)}</div><div class="m-detailmeta"><span>${mAsOf()}</span><span>演示源 WQ-SYNTH · L1 快照</span><button class="small quiet" data-m-watch="${id}">${icon('star')}管理观察分组</button></div></div>${!q.valid?`<div class="m-notice">${q.suspended?'停牌样本：报价为空，不能参与涨跌幅统计。':q.missing?'缺失行情：保留证券记录，不用零价替代。':'竞价虚拟参考价 '+fmt(q.indicative/100)+' 元，不是成交价。'}</div>`:''}<div class="m-poolbar"><button class="small ${view==='intraday'?'active':''}" data-m-detailview="intraday">分时比较</button><button class="small ${view==='daily'?'active':''}" data-m-detailview="daily">历史收盘</button><span class="spacer"></span><button class="small quiet" data-m-chartdata="${id}">行情数据表</button></div>${q.auctionReference!==null?`<div class="m-notice">收盘集合竞价参考 ${fmt(q.auctionReference/100)} 元；分时与成交额保留最后成交状态，15:00 再按收盘撮合更新。</div>`:''}${plot}<div class="m-detailgrid">${details.map(([l,v])=>`<div><span>${l}</span><b class="num">${v}</b></div>`).join('')}</div><div class="m-detailcolumns"><div><h3>盘口 · 合成 L1 快照</h3><table class="m-book"><tbody>${[5,4,3,2,1].map(n=>`<tr><td class="down">卖 ${n}</td><td>${!q.valid||q.sealed?'—':fmt(Math.min(q.upper??Infinity,q.p+n)/100)}</td><td>${!q.valid||q.sealed?'—':fmt(1000+n*130+q.i*100,0)+' 股'}</td></tr>`).join('')}${[1,2,3,4,5].map(n=>`<tr><td class="up">买 ${n}</td><td>${!q.valid||q.down?'—':fmt(Math.max(q.lower??0,q.sealed?q.p-n+1:q.p-n)/100)}</td><td>${!q.valid||q.down?'—':fmt(q.sealed&&n===1?q.bidQueue:1300+n*200+q.i*90,0)+' 股'}</td></tr>`).join('')}</tbody></table><div class="m-footnote">封单额 ${q.sealed?unit(q.bidQueue*q.price)+' 元':'—'} = 涨停价 × 当前买一股数。不是可成交承诺；五档均为演示值。</div></div><div><h3>状态与验证入口</h3><div class="kv"><span>逐笔委托 / 队列位置</span><b class="muted">— 未接入 L2</b></div><div class="kv"><span>主动买卖净额</span><b class="muted">— 未接入</b></div><div class="kv"><span>题材归属</span><b>${q.themes.map(g=>M_THEMES[g]).join(' / ')}</b></div><div class="kv"><span>样本规则版本</span><b>fixture-v2</b></div><p class="tiny sub">价格达到涨停价 ≠ 稳定封板 ≠ 能买到。此处用价格与合成买一队列展示“封板”状态，历史统计来自同一事件流。</p><button class="small quiet" data-m-sector-detail="${q.g}">板块对照与成分</button></div></div><h3 style="margin-top:22px">此时点已发生的事件</h3>${mRadarRows(mEvents().filter(e=>e.stock===id),8)}<div class="m-notice">研究边界：新看盘使用 SIM 虚构证券；旧“行情与复盘 / 策略回测 / 模拟交易”使用另一套合成样本。不会把两套价格与订单偷偷拼接。</div>`,`<button data-action="close-dialog">返回看盘</button><button data-m-export-stock="${id}">${icon('download')}观察单</button><button class="primary" data-m-addmulti="${id}">${icon('plus')}加入多股比较</button>`,true);
 $('#dialog').style.width='860px';mBindCharts();
}
function mRules(){mDialog('指标口径 · 看盘要能对账',`<div class="notice">这不是交易规则全集。原型使用固定样本规则；生产必须按证券、日期、板块、风险状态、上市阶段与除权参考价取得规则快照。</div><div class="m-definition"><h3>01　涨停状态：先区分价格与队列</h3><p><b>触板</b>：截至当前时刻至少一次达到涨停价。<b>当前封板</b>：最新成交价等于涨停价且本样本买一队列存在。<b>炸板未回封</b>：此前触板、当前未封。回封后不计入当前炸板数，但历史开板次数保留。</p><h3>02　连板与梯队</h3><p>连续若干样本日收盘涨停才确认连板；盘中显示“昨确认 N 板 / 今暂定 N+1 板”。无涨跌幅限制证券不参与涨停榜，停牌跨日如何断续应由生产规则单独明确。本样本没有跨日停复牌连板推断。</p><h3>03　炸板率</h3><p>本产品主口径 = 当前炸板未回封证券数 ÷ 截至当前曾触板证券数。回封会降低此值；它不是“曾开板比例”。两者不得混用，分母为 0 显示“—”。</p><h3>04　晋级率</h3><p>昨天收盘恰为 N 连板的固定队列，今天当前封板 / 收盘封板的数量 ÷ 昨天队列总数。盘中标暂定，缺行情列未知；先定义队列再看结果，不事后挑赢家。市场筛选一致。</p><h3>05　广度、涨幅和成交额</h3><p>上涨占比以有效、可比较成交价格证券为分母；平盘、停牌、缺失分列。板块涨跌幅为本样本成分等权均值，不是真实交易所指数。概念可交叉，市场成交额按证券 ID 去重；不累计概念金额。</p><h3>06　龙头与资金</h3><p>高度、成交额、领涨、首封四种候选分别排序，不输出“龙头置信度”。成交额不是净流入；封单是可撤销快照。未接入的主力资金 / L2 委托队列显示“—”，不生成数字。</p><h3>07　可见时间和数据缺失</h3><p>所有板块、梯队、龙头、事件与导出共用 ${mAsOf()}。资讯同时包含发布时间与可获取时间，后者不得晚于当前时点。日内最高、首封、开板次数只读取此前路径。先发布后修订的数据仍需历史版本。</p></div>`,`<button data-action="close-dialog">明白了</button><button class="primary" data-m-export="snapshot">导出当前可对账快照</button>`);$('#dialog').style.width='820px';}
function mQuality(){mDialog('数据状态与授权边界',`<div class="m-definition"><div class="kv"><span>数据环境</span><b>离线合成 · 未连接行情商</b></div><div class="kv"><span>样本版本</span><b>wq-market-fixture-2.0</b></div><div class="kv"><span>可见时点</span><b>${mAsOf()}</b></div><div class="kv"><span>样本总量</span><b>48 证券 / 3 演示日 / 分钟快照</b></div><div class="kv"><span>日历说明</span><b>指定演示日期，不是完整交易日历</b></div><div class="kv"><span>停牌 / 缺行情 / 无涨跌幅限制</span><b>各 1 只虚构样本</b></div><div class="kv"><span>L2 / 龙虎榜 / 正式公告</span><b>未接入，不显示伪数据</b></div><h3>状态演练</h3><p>选择状态后保留当前时点，暂停回放；恢复后才可推进。部分失败提示与本样本已存在的缺失项相对应。</p><div class="row wrap"><button data-m-quality-set="stale">数据过期</button><button data-m-quality-set="partial">部分缺失</button><button data-m-quality-set="permission">权限不足</button><button class="primary" data-m-quality-set="ok">恢复样本</button></div><p>不存在真实登录、真实延迟毫秒、推送授权或后台监控。数据质量降级不得隐藏，也不得把未知当成 0。</p></div>`);}
function mSectorDetail(g){const sector=mSectors().find(s=>s.g===Number(g));mDialog(sector.name+' · 成分与证据',`<div class="m-chartsummary"><b class="num ${cls(sector.pct)}">${mPct(sector.pct)}</b><span>有效 ${sector.valid.length} / ${sector.total} · 成分等权</span></div>${mChart([mSeries(sector.rows.map(q=>q.id)),mSeries(mUniverse({theme:false}).map(s=>s.id))],[sector.name,'全范围基准'])}${mStockTable(mSorted(sector.rows))}<div class="m-footnote">本视图遵循市场筛选；行业按唯一归属分区，概念成分允许交叉。显示为 ${mAsOf()} 的可见成分。</div>`,`<button data-action="close-dialog">返回</button><button class="primary" data-m-theme="${g}">全工作区联动此题材</button>`,true);$('#dialog').style.width='900px';mBindCharts();}
function mManageWatch(id){const s=M_BYID[id];mDialog('观察分组 · '+s.name,`<p>观察只是收藏与待验证记录，不创建委托。一个标的可以同时属于多个组。</p><div class="m-watchchecks">${Object.keys(mStore.groups).map(g=>`<label><input type="checkbox" data-m-watchcheck="${esc(g)}" ${mStore.groups[g].includes(id)?'checked':''}>${g}</label>`).join('')}</div>`,`<button data-action="close-dialog">取消</button><button class="primary" data-m-watchsave="${id}">保存分组</button>`);}
function mShowNews(id){const n=mNews().find(x=>x.id===id);if(!n){toast('该资讯尚未到可见时间。');return;}mDialog(n.title,`<span class="tag amber">虚构事件 · 仅为交互演示</span><div class="kv"><span>来源</span><b>${n.source}</b></div><div class="kv"><span>发布时间</span><b>${M_DATES[n.d]} ${M_TIMES[n.published]}</b></div><div class="kv"><span>可获取时间</span><b>${M_DATES[n.d]} ${M_TIMES[n.available]}</b></div><p>${n.body}</p><p class="muted">真实系统应在这里链接原始公告 / 发布页及历史修订。该演示事件没有真实原文，不能作为投资证据。</p>`,`<button data-action="close-dialog">关闭</button><button class="primary" data-m-theme="${n.g}">联动相关题材</button>`);}
function mShowEvent(id){const e=mEvents().find(x=>x.id===id);if(!e)return;mStore.read=[...new Set([...mStore.read,id])];mSave();const q=mQuote(e.stock,mState.day,e.k);mDialog(M_BYID[e.stock].name+' · '+e.type,`<span class="tag">本地样本事件 · 非买卖建议</span><div class="kv"><span>事件发生</span><b>${M_DATES[mState.day]} ${M_TIMES[e.k]}</b></div><div class="kv"><span>事件价</span><b>${mNum(q.price)} 元</b></div><div class="kv"><span>涨停 / 跌停价</span><b>${q.upper===null?'—':fmt(q.upper/100)+' / '+fmt(q.lower/100)}</b></div><div class="kv"><span>截至事件的开板次数</span><b>${q.opens}</b></div><p>查看事件时的全市场，会同步截断板块、梯队、候选、新闻及导出，不使用之后的信息。</p>`,`<button data-action="close-dialog">返回列表</button><button data-m-stock="${e.stock}">当前个股详情</button><button class="primary" data-m-eventtime="${e.k}">定位到事件时刻</button>`);}
function mSearch(initial=''){mDialog('搜索股票 / 题材',`<label class="sr-only" for="m-search">股票名称、SIM 代码、拼音首字母或题材</label><input id="m-search" placeholder="试试 云启 / SIM001 / YQSL / 机器人" value="${esc(initial)}" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="m-results" aria-autocomplete="list"><div id="m-results" role="listbox"></div><div class="m-footnote">↑ ↓ 选择 · Enter 打开 · Esc 关闭。48 只虚构证券；旧研究样本请切换“行情与复盘”。</div>`,'<button data-action="close-dialog">关闭</button>');$('#dialog').style.width='640px';mState.searchIndex=0;mSearchResults(initial);setTimeout(()=>$('#m-search')?.focus(),30);}
function mSearchResults(text){text=text.trim().toLowerCase();const a=[...M_STOCKS.filter(s=>[s.name,s.id,s.pinyin].some(v=>v.toLowerCase().includes(text))).map(s=>({id:s.id,name:s.name,kind:'stock',sub:s.id+' · '+M_THEMES[s.g]})),...M_THEMES.map((n,g)=>({id:g,name:n,kind:'theme',sub:'题材 · 联动全部看盘模块'})).filter(x=>x.name.includes(text))].slice(0,15);mState.searchResults=a;mState.searchIndex=Math.max(0,Math.min(mState.searchIndex||0,a.length-1));$('#m-results').innerHTML=a.map((x,i)=>`<button id="m-result-${i}" role="option" aria-selected="${i===mState.searchIndex}" class="m-searchresult ${i===mState.searchIndex?'active':''}" data-m-${x.kind==='stock'?'stock':'theme'}="${x.id}"><span>${x.name}<small>${x.sub}</small></span>${icon('chevron')}</button>`).join('')||'<div class="m-empty">未找到本地样本。试试代码 SIM001，或输入题材名称。</div>';if(a.length)$('#m-search').setAttribute('aria-activedescendant','m-result-'+mState.searchIndex);else $('#m-search').removeAttribute('aria-activedescendant');}
function mVisiblePool(){let q=mQuotes().filter(q=>q.valid&&!q.unrestricted);q=q.filter(q=>mState.pool==='sealed'?q.sealed:mState.pool==='broken'?q.wasBroken:mState.pool==='touched'?q.touched:mState.pool==='previous'?q.prevStreak>0:q.down);if(mState.height)q=q.filter(q=>mState.height===6?q.streak>=6:q.streak===mState.height);return q;}
function mCSV(rows){return '\ufeff'+rows.map(r=>r.map(v=>{let s=String(v??'');if(typeof v==='string'&&/^[\s]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function mExport(kind){const stamp=M_DATES[mState.day]+'_'+M_TIMES[mState.time].replace(':','');if(kind==='review'){downloadText('WaveQuant_'+stamp+'_'+(mState.time===M_END?'复盘':'盘中观察')+'.md',mReviewText(),'text/markdown;charset=utf-8');return;}
 if(kind==='snapshot'){downloadText('WaveQuant_'+stamp+'_看盘快照.json',JSON.stringify(mSnapshot(),null,2),'application/json');return;}
 if(kind==='events'){let rows=mEvents().filter(e=>mState.radarType==='all'||e.type===mState.radarType).filter(e=>mState.radarScope==='all'||Object.values(mStore.groups).some(a=>a.includes(e.stock)));if(mState.radarFrozen)rows=rows.filter(e=>mState.radarFrozen.includes(e.id));downloadText('WaveQuant_'+stamp+'_可见事件.csv',mCSV([['数据性质','观察截止','事件日期','事件时间','证券ID','名称','事件类型','事件ID'],...rows.map(e=>['虚构合成',mAsOf(),M_DATES[e.d],M_TIMES[e.k],e.stock,M_BYID[e.stock].name,e.type,e.id])]),'text/csv;charset=utf-8');return;}
 const rows=kind==='watch'?mStore.groups[mState.group].map(id=>mQuote(id)):kind==='pool'?mVisiblePool():mQuotes();downloadText('WaveQuant_'+stamp+'_'+(kind==='watch'?mState.group:kind==='pool'?'当前股票池':'行情')+'.csv',mCSV([['数据性质','观察截止','市场范围','题材筛选','证券ID','名称','现价_元','涨跌幅_百分比','成交额_元','换手率_百分比','当前封板','昨日确认连板','今日暂定或收盘连板','规则涨停价_元','数据状态'],...rows.map(q=>['虚构合成',mAsOf(),mState.board,mState.theme===null?'全部':mScopeName(),q.id,q.name,q.price,q.pct,q.amount,q.turnover,q.sealed,q.prevStreak,q.streak,q.upper===null?'':q.upper/100,q.valid?'有效样本':q.suspended?'停牌':q.missing?'缺失':'竞价参考'])]),'text/csv;charset=utf-8');}
function mObserveExport(id){const q=mQuote(id),body={type:'research-observation-v2',nature:'虚构样本，不是买卖指令',asOf:mAsOf(),quote:q,evidence:mEvents().filter(e=>e.stock===id),themes:q.themes.map(g=>M_THEMES[g]),hypothesis:'待研究员填写',invalidation:'待研究员填写',execution:'无；与旧研究/回测/账户样本隔离'};downloadText('WaveQuant_'+id+'_观察单.json',JSON.stringify(body,null,2),'application/json');}
function mAll(title,rows){mDialog(title,`<p class="tiny muted">${mAsOf()} · ${rows.length} 只 · 虚构合成价格</p>${mStockTable(rows)}`,`<button data-action="close-dialog">返回看盘</button>`,true);$('#dialog').style.width='1000px';}
function mBindCharts(){const charts=$$('[data-m-chart]:not(.m-mini)');for(const el of charts){el.onpointermove=e=>{const r=el.getBoundingClientRect(),pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),k=Math.max(1,Math.min(mState.time,Math.round((pos*800-46)/(800-63)*M_END)));const x=46+k/M_END*(800-63);for(const ch of charts){const line=ch.querySelector('.m-cross'),text=ch.querySelector('.m-cross-label');if(line){line.setAttribute('x1',x);line.setAttribute('x2',x);line.setAttribute('opacity','1');text.setAttribute('x',Math.min(690,x+5));text.textContent=M_TIMES[k];}}};el.onpointerleave=()=>{for(const ch of charts){ch.querySelector('.m-cross')?.setAttribute('opacity','0');const text=ch.querySelector('.m-cross-label');if(text)text.textContent='';}};}}
function mHandleButton(b){const d=b.dataset;
 if('mTblsort'in d){const table=b.closest('table'),key=d.mTblsort;let direction=table.dataset.sortKey===key?((Number(table.dataset.sortStep)||0)+1)%3:1;table.dataset.sortKey=key;table.dataset.sortStep=direction;const rows=[...table.querySelectorAll('tbody tr[data-m-row]')];rows.sort((a,c)=>{if(direction===0)return Number(a.dataset.mOriginal)-Number(c.dataset.mOriginal);const av=mQuote(a.dataset.mRow)[key],cv=mQuote(c.dataset.mRow)[key];if(av===null)return cv===null?0:1;if(cv===null)return -1;return(direction===1?-1:1)*(av-cv);});rows.forEach(r=>table.tBodies[0].appendChild(r));table.querySelectorAll('th').forEach(th=>th.removeAttribute('aria-sort'));b.closest('th').setAttribute('aria-sort',direction===0?'none':direction===1?'descending':'ascending');}
 else if('mYesterday'in d){mAll(d.mYesterday==='previous'?'昨日涨停 · 固定队列表现':'昨日连板 · 固定队列表现',mQuotes().filter(q=>!q.unrestricted&&(d.mYesterday==='previous'?q.prevStreak>0:q.prevStreak>=2)));}
 else if('mTab'in d){if($('#dialog').open)closeDialog();mTab(d.mTab);}
 else if('mStock'in d)mOpenStock(d.mStock);
 else if('mTime'in d){mStop();mSetTime(d.mTime);}
 else if('mPlay'in d){if(mState.playing){mStop();renderMarket();}else{if(mState.time===M_END)mState.time=1;mState.playing=true;mTimer=setInterval(()=>{if(state.page!=='market'||$('#dialog').open||mState.quality!=='ok'){mStop();return;}mState.time=Math.min(M_END,mState.time+4);if(mState.time===M_END)mStop();renderMarket();},900);renderMarket();}}
 else if('mTheme'in d){if($('#dialog').open)closeDialog();mState.scopeType=mState.industry&&mState.tab==='sectors'?'industry':'concept';mState.theme=Number(d.mTheme);mState.height=0;mTab(mState.tab==='overview'?'sectors':mState.tab);toast('已联动'+(mState.scopeType==='industry'?'行业：':'题材：')+mScopeName());}
 else if('mCleartheme'in d){mState.theme=null;mState.height=0;renderMarket();}
 else if('mReset'in d){if($('#dialog').open)closeDialog();mState.theme=null;mState.board='all';mState.height=0;mState.risk=false;renderMarket();}
 else if('mRules'in d)mRules();
 else if('mQuality'in d)mQuality();
 else if('mRecover'in d||'mQualitySet'in d){mStop();mState.quality=d.mQualitySet||'ok';if($('#dialog').open)closeDialog();renderMarket();}
 else if('mExport'in d)mExport(d.mExport);
 else if('mExportStock'in d)mObserveExport(d.mExportStock);
 else if('mSearch'in d)mSearch();
 else if('mSectorDetail'in d)mSectorDetail(Number(d.mSectorDetail));
 else if('mClassify'in d){mState.industry=d.mClassify==='industry';renderMarket();}
 else if('mSortDirection'in d){mState.desc=!mState.desc;renderMarket();}
 else if('mRotation'in d){const [day,g]=d.mRotation.split(',').map(Number);mState.theme=g;mState.scopeType=mState.industry?'industry':'concept';mStop();mSetTime(mState.time,day);}
 else if('mPool'in d){mState.pool=d.mPool;mState.height=0;renderMarket();}
 else if('mHeight'in d){mState.pool='sealed';mState.height=Number(d.mHeight);mTab('ladder');}
 else if('mWatch'in d)mManageWatch(d.mWatch);
 else if('mWatchsave'in d){const id=d.mWatchsave;$$('[data-m-watchcheck]').forEach(el=>{const g=el.dataset.mWatchcheck;mStore.groups[g]=mStore.groups[g].filter(x=>x!==id);if(el.checked)mStore.groups[g].push(id);});mSave();closeDialog();renderMarket();toast('观察分组已保存；未创建委托。');}
 else if('mRemove'in d){const id=d.mRemove,g=mState.group,old=[...mStore.groups[g]];mStore.groups[g]=old.filter(x=>x!==id);mSave();renderMarket();toast('已移出'+g,()=>{mStore.groups[g]=old;mSave();if(state.page==='market')renderMarket();});}
 else if('mAddmulti'in d){const id=d.mAddmulti;if(mStore.multi.includes(id))mStore.multi=[id,...mStore.multi.filter(x=>x!==id)];else mStore.multi=[id,...mStore.multi].slice(0,9);mSave();toast('已放到多屏第一位。');}
 else if('mColumns'in d){mStore.columns=Number(d.mColumns);mSave();renderMarket();}
 else if('mWatchmulti'in d){const ids=mStore.groups[mState.group];if(!ids.length){toast('当前观察组为空。');return;}mStore.multi=[...new Set([...ids,...mStore.multi])].slice(0,9);mSave();renderMarket();}
 else if('mNews'in d)mShowNews(d.mNews);
 else if('mEvent'in d)mShowEvent(d.mEvent);
 else if('mEventtime'in d){closeDialog();mStop();mSetTime(Number(d.mEventtime));}
 else if('mFreeze'in d){mState.radarFrozen=mState.radarFrozen?null:mEvents().map(e=>e.id);renderMarket();}
 else if('mReadall'in d){let rows=mEvents().filter(e=>mState.radarType==='all'||e.type===mState.radarType).filter(e=>mState.radarScope==='all'||Object.values(mStore.groups).some(a=>a.includes(e.stock)));if(mState.radarFrozen)rows=rows.filter(e=>mState.radarFrozen.includes(e.id));mStore.read=[...new Set([...mStore.read,...rows.map(e=>e.id)])];mSave();renderMarket();}
 else if('mDetailview'in d)mOpenStock(mState.selected,d.mDetailview);
 else if('mAll'in d)mAll('当前范围 · 完整行情',mSorted(mQuotes()));
 else if('mChartdata'in d){const id=d.mChartdata,a=mDay(id).points.slice(0,mState.time+1);mDialog(M_BYID[id].name+' · 可见分钟数据',`<div class="tablewrap"><table class="data-table"><thead><tr><th>时间</th><th>价格（元）</th><th>累计成交额（元）</th><th>封板</th><th>开板次数</th></tr></thead><tbody>${a.slice(-40).reverse().map(p=>`<tr><td>${M_TIMES[p.k]}</td><td>${p.p===null?'—':fmt(p.p/100)}</td><td>${fmt(p.amount,0)}</td><td>${p.sealed?'是':'否'}</td><td>${p.opens}</td></tr>`).join('')}</tbody></table></div><p>展示最近 40 个可见时点；没有显示之后的数据。</p>`);}
 else if('mIndex'in d){const i=Number(d.mIndex),keys=Object.keys(M_BOARDS),rows=i===0?M_STOCKS.filter(s=>!s.risk):i===5?mStore.groups['核心关注'].map(id=>M_BYID[id]):M_STOCKS.filter(s=>s.board===keys[i-1]&&!s.risk);mAll('示意指数 · 当前构成',rows.map(s=>mQuote(s.id)));}
 else if('mKpi'in d){const k=d.mKpi;if(k==='sealed'||k==='broken'||k==='down'){mState.pool=k;mState.height=0;mTab('ladder');}else if(k==='height'){mState.height=0;mState.pool='sealed';mTab('ladder');}else if(k==='breadth')mAll('市场广度 · 全部范围',mQuotes());else mRules();}
 else if('mBin'in d){const funcs=[q=>q.pct<=-7,q=>q.pct>-7&&q.pct<=-3,q=>q.pct>-3&&q.pct<0,q=>q.pct===0,q=>q.pct>0&&q.pct<3,q=>q.pct>=3&&q.pct<7,q=>q.pct>=7];mAll('涨跌分布 · 成分明细',mQuotes().filter(q=>q.valid&&funcs[Number(d.mBin)](q)));}
 else if('mCohort'in d){const n=Number(d.mCohort);mAll(`昨日 ${n} 板 · 固定晋级队列`,mQuotes().filter(q=>!q.unrestricted&&q.prevStreak===n));}
 else return false;return true;
}
// Capture prevents legacy research shortcuts/actions from crossing dataset boundaries.
document.addEventListener('click',e=>{if(state.page!=='market')return;const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='search'){e.preventDefault();e.stopImmediatePropagation();mSearch();return;}if(Object.keys(b.dataset).some(k=>k.startsWith('m'))){const attrs=[...b.attributes].filter(a=>a.name.startsWith('data-m-'));const selector=attrs.map(a=>'['+a.name+'="'+CSS.escape(a.value)+'"]').join('');if(mHandleButton(b)){e.preventDefault();e.stopImmediatePropagation();if(!$('#dialog').open&&selector){const next=$(selector);if(next&&next!==b)next.focus({preventScroll:true});}}}},true);
document.addEventListener('change',e=>{if(state.page!=='market')return;const el=e.target,d=el.dataset;
 if('mTimeline'in d){mStop();mSetTime(Number(el.value));}
 else if('mDay'in d){mStop();mSetTime(mState.time,Number(el.value));}
 else if('mBoard'in d){mState.board=el.value;mState.height=0;renderMarket();}
 else if('mRisk'in d){mState.risk=el.checked;renderMarket();}
 else if('mSectorSort'in d){mState.metric=el.value;renderMarket();}
 else if('mGroup'in d){mState.group=el.value;renderMarket();}
 else if('mRadarType'in d){mState.radarType=el.value;renderMarket();}
 else if('mRadarScope'in d){mState.radarScope=el.value;renderMarket();}
 else if('mMultislot'in d){mStore.multi[Number(d.mMultislot)]=el.value;mSave();renderMarket();}
 const attrs=[...el.attributes].filter(a=>a.name.startsWith('data-m-'));if(attrs.length){const sel=attrs.map(a=>'['+a.name+'="'+CSS.escape(a.value)+'"]').join('');const next=$(sel);if(next&&next!==el)next.focus({preventScroll:true});}
},true);
document.addEventListener('input',e=>{if(state.page!=='market')return;if(e.target.id==='m-search'){mState.searchIndex=0;mSearchResults(e.target.value);}if('mTimeline'in e.target.dataset){$('#m-time-label').textContent=M_TIMES[Number(e.target.value)]+' 预览';}if(e.target.id==='m-notes'){mStore.notes[M_DATES[mState.day]]=e.target.value;mSave();$('#m-note-status').textContent=mStorageOK?'已保存到当前浏览器':'保存失败，请导出';$('#m-report').textContent=mReviewText();}},true);
document.addEventListener('keydown',e=>{if(state.page!=='market'||e.isComposing||e.keyCode===229)return;const input=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;if($('#dialog').open){if(e.target.id==='m-search'&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();if(e.key==='Enter'){const x=mState.searchResults?.[mState.searchIndex];if(x){closeDialog();if(x.kind==='stock')mOpenStock(x.id);else{mState.theme=x.id;mState.scopeType='concept';mState.industry=false;mTab('themes');}}}else{mState.searchIndex+=e.key==='ArrowDown'?1:-1;mSearchResults(e.target.value);$('#m-result-'+mState.searchIndex)?.scrollIntoView({block:'nearest'});}}return;}if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')||!input&&e.key==='/'){e.preventDefault();e.stopImmediatePropagation();mSearch();return;}if(!input&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[a-zA-Z0-9]$/.test(e.key)){e.preventDefault();e.stopImmediatePropagation();mSearch(e.key);}if(e.target.matches('[data-m-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();const tabs=Object.keys(M_TABNAMES),i=tabs.indexOf(mState.tab),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;mTab(tabs[next]);$(`[data-m-tab="${tabs[next]}"]`)?.focus();}},true);
window.addEventListener('popstate',e=>{if(e.state?.marketTab)mTab(e.state.marketTab,false);});
window.addEventListener('beforeunload',mSave);
