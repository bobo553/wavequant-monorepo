name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.26.2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  cache: pip
                  cache-dependency-path: |
                      packages/wavequant-core/requirements-dev-lock.txt
                      apps/servers/wavequant-api/requirements-dev-lock.txt

            - name: Install WaveQuant Python dependencies
              run: |
                  python -m pip install --requirement packages/wavequant-core/requirements-dev-lock.txt
                  python -m pip install --requirement apps/servers/wavequant-api/requirements-dev-lock.txt
                  python -m pip install --no-deps --no-build-isolation --editable packages/wavequant-core
                  python -m pip install --no-deps --no-build-isolation --editable apps/servers/wavequant-api

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate agent harness
              run: pnpm harness:check

            - name: Build
              run: pnpm build

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Unit tests
              run: pnpm test:unit
