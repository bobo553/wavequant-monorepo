[project]
name = "wavequant-core"
version = "0.4.0"
description = "Framework-independent WaveQuant research, backtest, and operations core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
tdx = ["pytdx==1.72", "pandas>=2.2,<4"]
akshare = ["akshare>=1.18.94,<2"]
data = ["baostock==0.9.3"]
dev = ["build>=1.3,<2", "mypy>=2.3,<3", "pytest>=9.1,<10", "ruff>=0.16,<1"]

[project.scripts]
wavequant = "wavequant.interfaces.cli:main"

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["data", "dist", "output", "results"]

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["data/", "dist/", "output/", "results/"]

[[tool.mypy.overrides]]
module = ["akshare", "baostock", "pandas", "pytdx.*"]
ignore_missing_imports = true
